name: Build and Release MiniMax Agent Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows version to build (e.g., 3.0.54)'
        required: true
        type: string
      exe_url:
        description: 'Direct URL to Windows .exe (optional, auto-detected if not provided)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot p7zip-full curl unzip

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download Windows release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          EXE_URL="${{ github.event.inputs.exe_url }}"
          if [ -z "$EXE_URL" ]; then
            EXE_URL="https://file.cdn.minimax.io/public/minimax-agent-prod/release/MiniMax%20Code%20Setup%20${VERSION}.exe"
          fi
          
          mkdir -p /tmp/minimax-extract
          cd /tmp/minimax-extract
          
          echo "Downloading from: $EXE_URL"
          curl -fsSL -o "MiniMax Code Setup ${VERSION}.exe" "$EXE_URL"
          
          FILE_SIZE=$(stat -c%s "MiniMax Code Setup ${VERSION}.exe")
          if [ "$FILE_SIZE" -lt 50000000 ]; then
            echo "Downloaded file too small ($FILE_SIZE bytes)"
            exit 1
          fi
          
          echo "Downloaded successfully: $FILE_SIZE bytes"

      - name: Extract NSIS installer
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cd /tmp/minimax-extract
          mkdir -p extracted
          7z x -oextracted "MiniMax Code Setup ${VERSION}.exe"
          mkdir -p app-64
          7z x -oapp-64 extracted/\$PLUGINSDIR/app-64.7z

      - name: Update version references
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/VERSION=\".*\"/VERSION=\"${VERSION}\"/" build.sh
          sed -i "s/VERSION=\".*\"/VERSION=\"${VERSION}\"/" setup.sh
          sed -i "s/VERSION=\".*\"/VERSION=\"${VERSION}\"/" releases/download.sh
          sed -i "s|GITHUB_URL=.*|GITHUB_URL=\"https://github.com/unn-Known1/minimax-agent-linux/releases/download/v${VERSION}/minimax-agent_${VERSION}_amd64.deb\"|" releases/download.sh
          sed -i "s/Version: .*/Version: ${VERSION}/" linux-build/DEBIAN/control
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" linux-build/opt/minimax-agent/resources/resources/daemon/package.json
          sed -i "s/Version-[0-9.]*\-green/Version-${VERSION}-green/" README.md
          sed -i "s|v[0-9.]\+/minimax-agent_[0-9.]\+_amd64.deb|v${VERSION}/minimax-agent_${VERSION}_amd64.deb|g" README.md
          sed -i "s|minimax-agent_[0-9.]\+_amd64.deb|minimax-agent_${VERSION}_amd64.deb|g" README.md
          sed -i "s|minimax-agent_[0-9.]\+_amd64.deb|minimax-agent_${VERSION}_amd64.deb|g" INSTALL.md
          sed -i "s|minimax-agent_[0-9.]\+_amd64.deb|minimax-agent_${VERSION}_amd64.deb|g" CONTRIBUTING.md

      - name: Copy resources from Windows release
        run: |
          cp /tmp/minimax-extract/app-64/resources/app.asar \
             linux-build/opt/minimax-agent/resources/app.asar
          
          rm -rf linux-build/opt/minimax-agent/resources/app.asar.unpacked
          cp -r /tmp/minimax-extract/app-64/resources/app.asar.unpacked \
                linux-build/opt/minimax-agent/resources/app.asar.unpacked
          
          cp /tmp/minimax-extract/app-64/resources/app-update.yml \
             linux-build/opt/minimax-agent/resources/app-update.yml
          
          cp /tmp/minimax-extract/app-64/resources/resources/icon.ico \
             linux-build/opt/minimax-agent/resources/resources/icon.ico
          
          cp /tmp/minimax-extract/app-64/resources/resources/tray.ico \
             linux-build/opt/minimax-agent/resources/resources/tray.ico
          
          cp /tmp/minimax-extract/app-64/resources/resources/tray.png \
             linux-build/opt/minimax-agent/resources/resources/tray.png
          
          cp /tmp/minimax-extract/app-64/resources/resources/trayTemplate@2x.png \
             linux-build/opt/minimax-agent/resources/resources/trayTemplate@2x.png
          
          cp /tmp/minimax-extract/app-64/resources/resources/trayTemplate.png \
             linux-build/opt/minimax-agent/resources/resources/trayTemplate.png

      - name: Build .deb package
        run: sudo ./build.sh

      - name: Verify package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          dpkg-deb -I output/minimax-agent_${VERSION}_amd64.deb
          dpkg-deb -c output/minimax-agent_${VERSION}_amd64.deb | head -20

      - name: Copy to releases folder
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cp output/minimax-agent_${VERSION}_amd64.deb releases/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimax-agent-deb
          path: output/minimax-agent_${{ github.event.inputs.version }}_amd64.deb

      - name: Commit version changes
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git add -A
          git commit -m "Release v${VERSION}" || echo "No changes to commit"
          git tag -a "v${VERSION}" -m "Release v${VERSION}" || echo "Tag already exists"

      - name: Push changes and tags
        run: git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: "Release v${{ github.event.inputs.version }} - Updated from Windows ${{ github.event.inputs.version }}"
          files: |
            releases/minimax-agent_${{ github.event.inputs.version }}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Create Failure Issue
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed build
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ github.event.inputs.version }}";
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const runId = "${{ github.run_id }}";
            
            const title = `Build failed for MiniMax Agent Linux v${version}`;
            const body = `## Build Failure Report
            
**Version:** v${version}
**Workflow Run:** [#${runId}](${runUrl})
**Triggered by:** Manual dispatch
**Timestamp:** ${new Date().toISOString()}

### Error Details
The automated build for MiniMax Agent Linux v${version} failed. Please check the workflow logs for details.

### Next Steps
1. Review the workflow run: ${runUrl}
2. Check if the Windows release v${version} is available at the CDN
3. Verify the EXE URL is accessible
4. Manually trigger the workflow if needed after fixing issues

### Common Issues
- Windows release not yet available at CDN
- Network connectivity issues downloading the .exe
- Version mismatch in extracted files
- Native module rebuild failures (better-sqlite3, node-pty, etc.)
- Disk space or memory constraints on runner

---
*This issue was created automatically by the GitHub Actions workflow.`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['build-failure', 'automated', \`v${version}\`]
            });

            if (existingIssues.data.length > 0) {
              console.log('Issue already exists for this version:', existingIssues.data[0].html_url);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'automated', \`v${version}\`]
            });

            console.log('Created issue:', issue.data.html_url);
